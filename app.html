<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hedge Math - the app</title>
<style>
  :root { --accent: #4a3a7a; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, serif; max-width: 44em; margin: 2em auto; padding: 0 1em; color: #222; background: #fbfaf7; }
  h1 { color: var(--accent); margin-bottom: 0.1em; }
  .tag { color: var(--accent); font-style: italic; margin-top: 0; }
  .card { background: #fff; border: 1px solid #ddd; border-left: 4px solid var(--accent); border-radius: 6px; padding: 1em 1.2em; margin: 1.2em 0; }
  h3 { margin-top: 0; }
  label { display: block; font-size: 0.9em; font-weight: 600; margin: 0.7em 0 0.2em; }
  input { width: 100%; max-width: 12em; padding: 0.4em 0.5em; font-size: 1em; border: 1px solid #bbb; border-radius: 4px; background: #f4f3ef; }
  .big { font-weight: 600; color: var(--accent); line-height: 1.45; margin-top: 0.9em; }
  .err { color: #a33; }
  a { color: var(--accent); }
  .foot { margin-top: 2.5em; font-size: 0.85em; color: #777; }
</style>
</head>
<body>
<h1>Hedge Math</h1>
<p class="tag">Blade truth, hedge truth and tooth truth - labeled norms, honest arithmetic.</p>

<div class="card">
  <h3>The blade truth</h3>
  <label for="b-blade">Blade length (inches)</label>
  <input id="b-blade" type="number" step="any" value="24">
  <label for="b-height">Hedge height (feet)</label>
  <input id="b-height" type="number" step="any" value="4">
  <p class="big" id="b-out"></p>
</div>

<div class="card">
  <h3>The hedge truth</h3>
  <label for="h-length">Hedge length (feet)</label>
  <input id="h-length" type="number" step="any" value="30">
  <label for="h-passes">Passes per face (from the blade truth)</label>
  <input id="h-passes" type="number" step="any" value="3">
  <label for="h-pace">Your trimming pace (feet per minute)</label>
  <input id="h-pace" type="number" step="any" value="20">
  <p class="big" id="h-out"></p>
</div>

<div class="card">
  <h3>The tooth truth</h3>
  <label for="t-gap">Tooth gap (inches)</label>
  <input id="t-gap" type="number" step="any" value="0.75">
  <label for="t-branch">Your branch (inches)</label>
  <input id="t-branch" type="number" step="any" value="0.5">
  <p class="big" id="t-out"></p>
</div>

<p class="foot">The 3-inch grip norm and the 0.8 tooth norm are labeled norms - the arithmetic is honest, and the last face at dusk keeps the honest ledger.</p>

<script src="engine.js"></script>
<script>
function g(id){ return document.getElementById(id); }
function v(id){ return parseFloat(g(id).value); }
function show(id, msg, isErr){ var el = g(id); el.textContent = msg; el.className = isErr ? "err big" : "big"; }

function runBlade(){
  var args = [v("b-blade"), v("b-height")];
  var r = HedgeMath.bladePlan.apply(null, args);
  if (r.error) return show("b-out", r.error, true);
  show("b-out", HedgeMath.renderBlade.apply(null, [r].concat(args)), false);
}
function runHedge(){
  var args = [v("h-length"), v("h-passes"), v("h-pace")];
  var r = HedgeMath.hedgePlan.apply(null, args);
  if (r.error) return show("h-out", r.error, true);
  show("h-out", HedgeMath.renderHedge.apply(null, [r].concat(args)), false);
}
function runTooth(){
  var args = [v("t-gap"), v("t-branch")];
  var r = HedgeMath.toothPlan.apply(null, args);
  if (r.error) return show("t-out", r.error, true);
  show("t-out", HedgeMath.renderTooth.apply(null, [r].concat(args)), false);
}

["b-blade","b-height"].forEach(function(id){ g(id).addEventListener("input", runBlade); });
["h-length","h-passes","h-pace"].forEach(function(id){ g(id).addEventListener("input", runHedge); });
["t-gap","t-branch"].forEach(function(id){ g(id).addEventListener("input", runTooth); });
runBlade(); runHedge(); runTooth();
</script>
</body>
</html>
